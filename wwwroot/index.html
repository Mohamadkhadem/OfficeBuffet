  <meta name="theme-color" content="#1f7a3a">
  <link rel="manifest" href="/manifest.webmanifest">

  <header class="topbar">
    <a class="brand" href="#/"><img src="/icons/icon.svg" alt=""><span>بوفه</span></a>
    <div class="top-actions">
      <div id="account"></div>
      <button type="button" class="icon-btn outline" id="theme-btn" data-theme-toggle></button>
    </div>
  </header>
  <!-- Main menu: a bottom bar on phones, a grouped sidebar (manager) or top tabs (colleague) on wide screens. -->
  <nav class="nav" id="tabs" aria-label="منوی اصلی" hidden></nav>
  <!-- «بیشتر» on phones (manager): the less frequent pages, the account and log out. -->
  <dialog id="more-sheet" class="sheet" aria-labelledby="more-title">
    <div class="sheet-panel">
      <span class="sheet-grab" aria-hidden="true"></span>
      <h2 id="more-title" class="visually-hidden">بیشتر</h2>
      <div id="more-body"></div>
    </div>
  </dialog>
  <main id="view"><div class="loading">در حال بارگذاری…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-body">
      <h3 id="dialog-title"></h3>
      <p id="dialog-text" class="muted"></p>
      <input id="dialog-input" autocomplete="off">
      <div class="row-end">
        <button type="button" class="btn ghost" id="dialog-cancel">انصراف</button>
        <button value="ok" class="btn danger" id="dialog-ok">تأیید</button>
      </div>
    </form>
  </dialog>
  <!-- Receipt photo at full size (payments reported by colleagues). -->
  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <b id="viewer-title"></b>
      <a id="viewer-open" class="btn ghost small" target="_blank" rel="noopener">اندازه‌ی کامل</a>
      <button type="button" class="icon-btn" id="viewer-close" title="بستن" aria-label="بستن"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <img id="viewer-img" alt="عکس فیش واریزی">
  </dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
